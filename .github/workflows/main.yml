name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Python käyttöön
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Aja testit
        run: python -m unittest discover -s src/tests -v